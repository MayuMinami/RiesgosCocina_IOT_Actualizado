[platformio]
default_envs = wokwi

[env]
platform = espressif32
board = esp32dev
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/provision_secret.py
lib_deps =
  adafruit/DHT sensor library
  adafruit/Adafruit Unified Sensor
  knolleary/PubSubClient@^2.8

[env:wokwi]
build_flags = -DWOKWI_SIMULATION

[env:esp32dev]
; Para ESP32 fisico: Bluetooth Classic SPP activo.

[env:esp32wifi]
; ESP32 fisico con WiFi real + MQTT/TLS (misma logica que Wokwi, compatible con la app).
; Antes de compilar: copiar include/wifi.example.h como include/wifi.h y poner la red.
build_flags = -DWOKWI_SIMULATION -DWIFI_REAL
